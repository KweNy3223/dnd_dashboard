<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dndGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#949ba4" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="facetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5865f2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2b2d31" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Внешний шестиугольник d20 -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           fill="url(#facetGrad)" 
           stroke="url(#dndGrad)" 
           stroke-width="3" 
           stroke-linejoin="round" />

  <!-- Центральный треугольник -->
  <polygon points="50,26 78,66 22,66" 
           fill="rgba(255, 255, 255, 0.08)" 
           stroke="url(#dndGrad)" 
           stroke-width="2.5" 
           stroke-linejoin="round" />

  <!-- Соединяющие ребра к внешним вершинам -->
  <line x1="50" y1="6" x2="50" y2="26" stroke="url(#dndGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="88" y1="28" x2="50" y2="26" stroke="url(#dndGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="28" x2="50" y2="26" stroke="url(#dndGrad)" stroke-width="2" stroke-linecap="round" />
  
  <line x1="88" y1="28" x2="78" y2="66" stroke="url(#dndGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="88" y1="72" x2="78" y2="66" stroke="url(#dndGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="94" x2="78" y2="66" stroke="url(#dndGrad)" stroke-width="2.5" stroke-linecap="round" />

  <line x1="12" y1="28" x2="22" y2="66" stroke="url(#dndGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="72" x2="22" y2="66" stroke="url(#dndGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="94" x2="22" y2="66" stroke="url(#dndGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Число 20 в центре -->
  <text x="50" y="55" 
        font-family="Segoe UI, system-ui, sans-serif" 
        font-size="16" 
        font-weight="800" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="0.5">20</text>
</svg>
